[project]
name = "akunta-ai-worker"
version = "0.1.0"
description = "Python AI worker untuk Akunta: parsing, OCR, klasifikasi, dan ekstraksi dokumen keuangan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "pypdf>=6.0",
    "openpyxl>=3.1",
    "Pillow>=11.0",
    # Dipakai adapter provider AI untuk memanggil endpoint vendor (plan.md §13.3).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
