# Environment pengembangan Akunta (plan.md §37 Phase 0).
#
# Service mengikuti arsitektur pada plan.md §3: Laravel sebagai aplikasi utama, queue
# worker terpisah, PostgreSQL sebagai penyimpan data akuntansi, Redis untuk queue dan
# cache, MinIO sebagai object storage private, dan Python AI worker berdiri sendiri.

name: akunta

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan serve --host=0.0.0.0 --port=8000
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
            AWS_ENDPOINT: http://minio:9000
            AI_WORKER_URL: http://ai-worker:8001
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan queue:work --tries=3 --max-time=3600
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
            AWS_ENDPOINT: http://minio:9000
            AI_WORKER_URL: http://ai-worker:8001
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    vite:
        image: node:22-bookworm-slim
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-akunta}
            POSTGRES_USER: ${DB_USERNAME:-akunta}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-akunta}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-init-test-database.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-akunta} -d ${DB_DATABASE:-akunta}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    # plan.md §30: dokumen finansial wajib berada di private storage, bukan public URL.
    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-akunta}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-akunta-secret}
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - minio_data:/data
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 10

    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            sh -c "
            mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-akunta} ${AWS_SECRET_ACCESS_KEY:-akunta-secret} &&
            mc mb --ignore-existing local/${AWS_BUCKET:-akunta-documents} &&
            mc anonymous set none local/${AWS_BUCKET:-akunta-documents}
            "

    ai-worker:
        build:
            context: ./ai-worker
        command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
        ports:
            - '${AI_WORKER_PORT:-8001}:8001'
        volumes:
            - ./ai-worker:/app
        environment:
            AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:-local-dev-token}
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    redis_data:
    minio_data:
    node_modules:
